# ==============================================================================
# Andaman Pearl Project - Nginx Reverse Proxy Configuration (Gateway)
# Handles strict routing parity between Next.js Frontend & Laravel Backend
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost andamanpearl.local reverse-proxy;

    # Adjust maximum allowed upload size for luxury pearl media/documents
    client_max_body_size 64M;

    # --- 1. Backend API & Sanctum Authentication Routing ---
    location ~ ^/(api|sanctum|vendor|storage) {
        # ตัด try_files ออก เพราะตู้ reverse-proxy ไม่มีไฟล์ php อยู่จริง
        # ส่งข้อมูลตรงเข้า PHP-FPM ในตู้ backend ทันที
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;

        fastcgi_read_timeout 600;

        # ส่งต่อข้อมูล Headers ที่จำเป็นเพื่อให้ Laravel ใช้เช็กเรื่อง Trust Proxies/URL Generation ได้อย่างถูกต้อง
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # --- 2. Frontend Application Routing (Next.js) ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        # Webpack/Turbopack HMR (Hot Module Replacement) Support over WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
