; ==============================================================================
; Andaman Breeze Project - Custom PHP Configuration Overrides
; Optimized for Development Efficiency & Heavy Media Handling
; ==============================================================================

date.timezone = Asia/Bangkok

; Memory limits and execution structures
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 600

; Error Reporting for Development Clarity
error_reporting = E_ALL
display_errors = On
display_startup_errors = On

; Opcache Tweaks for Quick Response Rates
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
